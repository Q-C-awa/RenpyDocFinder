<div class="app">
  <header class="top-bar" id="topBar">
    <button class="icon-btn" id="btnMenu" aria-label="目录" title="目录"><svg><use href="#i-menu"></use></svg></button>
    <div class="brand" id="brand" role="button" tabindex="0" title="回到首页">
      <span class="brand-logo">
        <img id="brandIcon" alt="RenPyDoc" style="display:none">
        <svg id="brandIconFallback"><use href="#i-menu-book"></use></svg>
      </span>
      <span class="brand-text">
        <span class="brand-title">Ren'Py 文档助手</span>
        <span class="brand-sub">RenPyDoc Finder</span>
      </span>
    </div>
    <div class="top-search">
      <svg class="search-icon"><use href="#i-search"></use></svg>
      <input id="searchInput" type="text" autocomplete="off" spellcheck="false" aria-label="搜索">
      <button class="clear-btn" id="searchClear" hidden aria-label="清空"><svg><use href="#i-close"></use></svg></button>
    </div>
    <div class="top-actions">
      <div class="seg" id="langSeg" role="group" aria-label="文档语言">
        <button data-lang="zh" class="active">中文</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="tonal-btn" id="topSource" disabled title="打开当前页在线原文（请先打开一个文档页面）"><svg><use href="#i-open-new"></use></svg><span>原文</span></button>
      <button class="icon-btn" id="btnTheme" aria-label="切换深浅色" title="切换深浅色 (Alt+T)"><svg class="i-dark"><use href="#i-dark"></use></svg><svg class="i-light"><use href="#i-light"></use></svg></button>
      <button class="icon-btn has-badge" id="btnUpdate" aria-label="检查文档更新" title="检查文档更新"><svg><use href="#i-refresh"></use></svg><span class="badge" id="updateBadge" hidden></span></button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-title">文档目录</span>
        <span class="sidebar-count" id="sidebarCount"></span>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-foot">
        <a href="https://gitee.com/kurororo666/Renpydoc-ranslate" class="text-btn" data-external="1">中文文档仓库 (Gitee)</a>
        <a href="https://www.renpy.org/doc/html/" class="text-btn" data-external="1">英文官方文档</a>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <main class="main" id="main">
      <section class="view view-home" id="viewHome"></section>

      <section class="view view-results" id="viewResults" hidden>
        <div class="results-head">
          <div class="chips" id="filterChips" role="group" aria-label="结果筛选"></div>
          <span class="results-count" id="resultsCount"></span>
        </div>
        <div class="results" id="resultsList"></div>
        <div class="empty" id="emptyState" hidden>
          <svg><use href="#i-search"></use></svg>
          <h3>没有找到相关结果</h3>
          <p>试试更短的关键词、用「|」连接多个词，或者切换到英文文档搜索。</p>
        </div>
      </section>

      <section class="view view-page" id="viewPage" hidden>
        <div class="page-head">
          <button class="icon-btn" id="pageBack" aria-label="返回" title="返回"><svg><use href="#i-arrow-back"></use></svg></button>
          <div class="page-title" id="pageTitle"></div>
        </div>
        <div class="page-toc" id="pageToc"></div>
        <div class="page-body" id="pageBody"></div>
      </section>
    </main>
  </div>

  <footer class="status-bar" id="statusBar">
    <span class="status-item" id="statusZh"><svg class="tiny"><use href="#i-check"></use></svg>中文 103 页</span>
    <span class="status-item" id="statusEn"><svg class="tiny"><use href="#i-check"></use></svg>英文 113 页 · v8.5.2</span>
    <span class="status-item" id="statusGenerated"></span>
    <span class="status-item status-update" id="statusUpdate"><svg class="tiny"><use href="#i-refresh"></use></svg><span>更新检测待命</span></span>
    <span class="status-item status-shortcut">快捷键：/ 搜索 · ↑↓ 选择 · Enter 打开 · Esc 返回 · Alt+E 切换语言 · Alt+T 主题</span>
  </footer>
</div>

<div class="snackbar" id="snackbar" role="status"></div>
<div class="progress" id="progressBar"><div class="progress-inner"></div></div>

<script src="data/meta.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
