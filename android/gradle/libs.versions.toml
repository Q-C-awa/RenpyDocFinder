[versions]
agp = "8.13.2"
kotlin = "2.0.21"
# 这里整套锁到与 AGP 8.13.2 / compileSdk 36 完全配套的稳定版本。
# 新模板自带的 core 1.19+ / appcompat 1.8+ / material 1.13+ 需要 AGP 9.x 或引入了
# aapt2 尚不支持的新资源（macro），会报 AAR metadata / "Can not extract resource"。
# 将来整体升到 AGP 9.1+ / compileSdk 37 后再一起往上调。
coreKtx = "1.13.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.0"
material = "1.11.0"
recyclerview = "1.3.2"
drawerlayout = "1.2.0"
webkit = "1.12.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-drawerlayout = { group = "androidx.drawerlayout", name = "drawerlayout", version.ref = "drawerlayout" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

